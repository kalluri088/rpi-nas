<!DOCTYPE hml>
<html>
	<head>
		<title>NAS Dashboard</title>
		<link rel = "stylesheet" href = "/static/style.css">
	</head>
	<body>
		
		<h1>NAS Dashboard</h1>
		<button onclick="logout()">Logout</button>
		<p>  </p>
		<div>
			<input type = "file" id="fileInput">
			<button onclick = "uploadFile()">Upload</button>
		</div>
		
		<h2>Disk Usage</h2>
		<div id = "diskUsage">
		</div>
		<progress
				id = "diskBar"
				value "0"
				max = "100"
				style = "width: 50px;">			
		</progress>
		
		<h2>Files</h2>
					
		<button onclick = "goBack()"><= Back</button>
		<p> </p>
		<div id = "currentPath"></div>
		
		<div>
			<input
				type="text"
				id="folderName"
				placeholder="Folder name">

			<button onclick="createFolder()">
				Create Folder
			</button>
		</div>
		
		<table>
			
			<thead>
				<tr>
					<th>Name</th>
					<th>Size</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id = "fileTable">
			</tbody>
			
		</table>
		<br>
		<div id="monitor-container">

			<div class="card">
				<h3>CPU</h3>
				<p id="cpu">Loading...</p>
			</div>

			<div class="card">
				<h3>RAM</h3>
				<p id="ram">Loading...</p>
			</div>

			<div class="card">
				<h3>Temperature</h3>
				<p id="temp">Loading...</p>
			</div>

			<div class="card">
				<h3>Disk</h3>
				<p id="disk">Loading...</p>
			</div>

		</div>
		<script src = "/static/app.js"></script>
		
	</body>
</html>
